server:
  port: 0

spring:
  application:
    name: fitverse-backend-test

  datasource:
    url: jdbc:h2:mem:fitverse_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

fitverse:
  jwt:
    secret: FitverseSuperSecretKeyForJwtTokenGenerationMinimum256BitsLong2026!
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173
